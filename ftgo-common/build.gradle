apply plugin: 'java-library'
apply plugin: 'java-test-fixtures'

bootJar {
    enabled = false
}

jar {
    enabled = true
}

// Root build.gradle's spring-cloud-dependencies BOM predates the Boot version pinned at the
// root (3.5.16) — see ftgo-gateway-common/build.gradle for the same override and rationale.
// testFixtures here pulls in spring-cloud-contract-verifier, so this module needs the matching
// 2025.0.3 BOM on its own classpath too.
dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.3'
    }
}

dependencies {
    // api, not implementation: consumers need JpaRepository/KafkaTemplate on their own compile
    // classpath to call inherited methods on OutboxEventRepository/ProcessedEventRepository and
    // to reference KafkaTemplate — declared once here, no longer duplicated by the root build.gradle
    // (ftgo-common is now excluded from the blanket subprojects{} dependency block) or by each
    // consuming service's own build.gradle (which used to separately declare spring-kafka).
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.kafka:spring-kafka'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Shared Kafka bridge for Spring Cloud Contract messaging tests (consumed by
    // order-service/order-history-service/kitchen-service contract tests added in later tasks).
    testFixturesApi 'org.springframework.cloud:spring-cloud-contract-verifier'
    testFixturesApi 'org.springframework.kafka:spring-kafka-test'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
}

// The java-test-fixtures plugin only creates a 'testFixtures' (main-like) source set — it does
// not provide a runnable test source set/task for tests that exercise the fixtures themselves.
// Register one explicitly (source dir src/testFixtures/test/java) so the round-trip proof test
// for the Kafka bridge lives next to the fixtures it tests, without polluting this module's
// regular src/test (which has nothing to do with contract testing).
sourceSets {
    testFixturesTest {
        java {
            srcDirs = ['src/testFixtures/test/java']
        }
        compileClasspath += sourceSets.testFixtures.output + configurations.testFixturesRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('testFixturesTest', Test) {
    description = 'Runs tests that exercise the testFixtures Kafka bridge itself.'
    group = 'verification'
    testClassesDirs = sourceSets.testFixturesTest.output.classesDirs
    classpath = sourceSets.testFixturesTest.runtimeClasspath
    useJUnitPlatform()
}

check.dependsOn testFixturesTest
