services:

  mysql:
    image: mysql:8.4
    command: --log-bin=mysql-bin --binlog-format=ROW --binlog-row-image=FULL --server-id=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ftgo
      MYSQL_PASSWORD: ftgo
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ftgo", "-pftgo"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  service-registry:
    build:
      context: .
      dockerfile: ftgo-service-registry/Dockerfile
    ports:
      - "8761:8761"

  authorization-server:
    build:
      context: .
      dockerfile: ftgo-authorization-server/Dockerfile
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/oauth2/jwks"]
      interval: 10s
      timeout: 5s
      retries: 10

  config-server:
    build:
      context: .
      dockerfile: ftgo-config-server/Dockerfile
    ports:
      - "8888:8888"
    environment:
      # Dockerfile copies the whole build-stage workspace checkout (.git included) to
      # /config-source-repo specifically so JGit has a real git working copy to open; without
      # this override application.yml's default (file://${user.dir}/..) resolves to "/" inside
      # the container, which has no .git.
      CONFIG_SERVER_GIT_URI: file:///config-source-repo

  kafka-connect:
    # 3.0.0.Final: 2.7.x issues SHOW MASTER STATUS against MySQL, which 8.4 removed
    # (renamed to SHOW BINARY LOG STATUS) — connector reports RUNNING while silently
    # delivering zero events on 2.7.x. Do not downgrade without re-verifying against mysql:8.4.
    image: debezium/connect:3.0.0.Final
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      # 8087 host-side avoids colliding with kitchen-service's 8083:8083 mapping below;
      # container-internal port stays 8083 (used by the healthcheck and connector-registrar).
      - "8087:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 10

  connector-registrar:
    image: curlimages/curl:8.10.1
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./infrastructure/debezium/outbox-connector.json:/outbox-connector.json:ro
    environment:
      OUTBOX_PUBLISH_MODE: ${OUTBOX_PUBLISH_MODE:-polling}
    entrypoint:
      - sh
      - -c
      - |
        if [ "$$OUTBOX_PUBLISH_MODE" = "cdc" ]; then
          curl -s -X PUT http://kafka-connect:8083/connectors/outbox-connector/config -H "Content-Type: application/json" -d @/outbox-connector.json
        else
          curl -s -X DELETE http://kafka-connect:8083/connectors/outbox-connector || true
        fi
    restart: "no"

  restaurant-service:
    build:
      context: .
      dockerfile: ftgo-restaurant-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
      authorization-server:
        condition: service_healthy
      tempo:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ftgo_restaurant
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-registry:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://authorization-server:9000/oauth2/jwks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: .
      dockerfile: ftgo-order-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
      restaurant-service:
        condition: service_healthy
      authorization-server:
        condition: service_healthy
      tempo:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ftgo_order
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-registry:8761/eureka/
      OUTBOX_PUBLISH_MODE: ${OUTBOX_PUBLISH_MODE:-polling}
      SAGA_MODE: ${SAGA_MODE:-choreography}
      PERSISTENCE_MODE: ${PERSISTENCE_MODE:-jpa}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://authorization-server:9000/oauth2/jwks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  kitchen-service:
    build:
      context: .
      dockerfile: ftgo-kitchen-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
      authorization-server:
        condition: service_healthy
      tempo:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ftgo_kitchen
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      SAGA_MODE: ${SAGA_MODE:-choreography}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-registry:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://authorization-server:9000/oauth2/jwks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  consumer-service:
    build:
      context: .
      dockerfile: ftgo-consumer-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      authorization-server:
        condition: service_healthy
      tempo:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ftgo_consumer
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      SAGA_MODE: ${SAGA_MODE:-choreography}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://authorization-server:9000/oauth2/jwks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  accounting-service:
    build:
      context: .
      dockerfile: ftgo-accounting-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
      authorization-server:
        condition: service_healthy
      tempo:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ftgo_accounting
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      SAGA_MODE: ${SAGA_MODE:-choreography}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-registry:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://authorization-server:9000/oauth2/jwks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  delivery-service:
    build:
      context: .
      dockerfile: ftgo-delivery-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
      authorization-server:
        condition: service_healthy
      tempo:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ftgo_delivery
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      SAGA_MODE: ${SAGA_MODE:-choreography}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-registry:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://authorization-server:9000/oauth2/jwks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-history-service:
    build:
      context: .
      dockerfile: ftgo-order-history-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
      authorization-server:
        condition: service_healthy
      tempo:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ftgo_order_history
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-registry:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://authorization-server:9000/oauth2/jwks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  mobile-gateway:
    build:
      context: .
      dockerfile: ftgo-mobile-gateway/Dockerfile
    depends_on:
      service-registry:
        condition: service_started
      order-service:
        condition: service_healthy
      kitchen-service:
        condition: service_healthy
      accounting-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      authorization-server:
        condition: service_healthy
      tempo:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-registry:8761/eureka/
      GATEWAY_JWT_JWKSETURI: http://authorization-server:9000/oauth2/jwks
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  public-gateway:
    build:
      context: .
      dockerfile: ftgo-public-gateway/Dockerfile
    depends_on:
      service-registry:
        condition: service_started
      order-service:
        condition: service_healthy
      kitchen-service:
        condition: service_healthy
      accounting-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      order-history-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      authorization-server:
        condition: service_healthy
      tempo:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8091:8091"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://service-registry:8761/eureka/
      GATEWAY_JWT_JWKSETURI: http://authorization-server:9000/oauth2/jwks
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    user: root
    depends_on:
      logstash:
        condition: service_started
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--strict.perms=false"]

  kibana-index-pattern-registrar:
    image: curlimages/curl:8.10.1
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - ./kibana/saved-objects/index-pattern.ndjson:/index-pattern.ndjson:ro
    entrypoint:
      - sh
      - -c
      - |
        curl -s -X POST http://kibana:5601/api/saved_objects/_import?overwrite=true \
          -H "kbn-xsrf: true" \
          --form file=@/index-pattern.ndjson
    restart: "no"

volumes:
  mysql-data:
