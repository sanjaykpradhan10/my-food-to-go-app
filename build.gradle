plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    // 4.3.4 is the spring-cloud-contract-verifier release confirmed (Ch.10 Task 1) to resolve
    // cleanly against this project's Spring Cloud 2025.0.3 BOM setup; the Gradle plugin ships
    // from the same release train as the verifier artifact.
    id 'org.springframework.cloud.contract' version '4.3.4' apply false
    // Brings up/tears down compose-component-test.yml around the componentTest task on
    // ftgo-order-service (Ch.10 sub-project 2) — the same plugin the book uses for its own
    // out-of-process component-test example.
    id 'com.avast.gradle.docker-compose' version '0.17.12' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.sanjay.ftgo'
    version = '0.0.1-SNAPSHOT'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.0"
        }
    }

    test {
        useJUnitPlatform()
    }
}

// ftgo-common is a plain library (no REST layer, no JDBC runtime of its own) — it declares
// its own minimal dependency set in its own build.gradle instead of inheriting the runnable
// services' web/mysql/test stack, so its classpath isn't bloated with dependencies it never uses.
// The gateway modules are WebFlux-based and need reactive starters, not servlet web/JPA.
def reactiveModules = ['ftgo-common', 'ftgo-gateway-common', 'ftgo-mobile-gateway', 'ftgo-public-gateway', 'ftgo-end-to-end-test']

// ftgo-authorization-server declares its own web starter directly (see its build.gradle) and
// has no database of its own (hardcoded in-memory user store), so it's excluded here to avoid
// pulling in JPA/MySQL it never uses. Unlike ftgo-authorization-server, ftgo-service-registry
// stays on the default block below even though it also skips JPA — it already relies on that
// block for its web starter (its own build.gradle only declares the Eureka server starter).
def noDefaultWebJpaModules = reactiveModules + ['ftgo-authorization-server', 'ftgo-config-server']

configure(subprojects.findAll { !noDefaultWebJpaModules.contains(it.name) }) {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        runtimeOnly    'com.mysql:mysql-connector-j'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly    'com.h2database:h2'
    }
}

// The 9 services actually run as standalone processes/containers in compose.yml and benefit
// from a real health endpoint (Ch.11, §11.3.1 Health check API pattern). Library modules
// (ftgo-common, ftgo-gateway-common), contract-stub modules, ftgo-service-registry (the Eureka
// server itself — out of scope for this pattern), and ftgo-end-to-end-test (a test-only module,
// never runs standalone) are deliberately excluded.
def actuatorModules = ['ftgo-order-service', 'ftgo-kitchen-service', 'ftgo-consumer-service',
                        'ftgo-restaurant-service', 'ftgo-accounting-service', 'ftgo-delivery-service',
                        'ftgo-order-history-service', 'ftgo-mobile-gateway', 'ftgo-public-gateway']

configure(subprojects.findAll { actuatorModules.contains(it.name) }) {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-registry-prometheus'
        implementation 'io.micrometer:micrometer-tracing-bridge-otel'
        implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
        // Emits JSON-structured console logs (Ch.11 §11.3.2 Log aggregation) so Logstash can
        // parse them without a grok pattern; the JSON automatically carries the traceId/spanId
        // already in MDC from micrometer-tracing-bridge-otel above, correlating logs to traces.
        implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
        // Ch.11 §11.3.5 Exception tracking: auto-captures any exception that reaches Spring's
        // default error handling (i.e. NOT already caught by a local @ExceptionHandler) and
        // reports it to GlitchTip. NOTE: trace/span correlation with Tempo/Kibana is NOT
        // implemented — the Sentry Java SDK keeps its own independent trace id unless a
        // sentry-opentelemetry-* integration is added, which this project does not do; a
        // GlitchTip issue's trace id will NOT match the request's Tempo traceId or its Kibana
        // log lines' traceId field. Do not rely on this for cross-referencing.
        // -jakarta variant required: this project is Spring Boot 3 (jakarta namespace), which
        // discovers auto-configuration via AutoConfiguration.imports, not the legacy
        // spring.factories mechanism the plain (non-jakarta) starter still uses; without
        // -jakarta, SentryAutoConfiguration silently never runs and nothing is ever captured.
        // 7.14.0 (as originally specified) isn't a published version on Maven Central; pinned to
        // 7.22.5, the latest stable 7.x release, to stay off the unreleased-at-plan-time 8.x line.
        implementation 'io.sentry:sentry-spring-boot-starter-jakarta:7.22.5'
    }
}

// Spring Boot's Config Data API inserts an import's properties immediately below the document
// that declares "spring.config.import" — so a key declared in that *same* application.yml always
// wins over the same key coming from the import, no matter what spring.cloud.config.allow-override
// / override-none say (those only ever governed the legacy bootstrap-context client). That is the
// opposite of this project's intended "compose env vars > config-server > local application.yml"
// precedence, and was confirmed against ftgo-order-service: config-repo/application.yml's broader
// management.endpoints.web.exposure.include list lost to the narrower one in this file.
//
// The fix used everywhere in this project (see compose.yml's SPRING_CONFIG_IMPORT env var) is to
// never declare spring.config.import inside a service's own application.yml at all — declaring it
// as an environment variable/system property instead makes it part of a *higher*-precedence,
// separate property source, so the config-server import it triggers now correctly outranks the
// service's local application.yml. This gives local `./gradlew bootRun` the same behavior compose
// already had, without requiring every developer to export SPRING_CONFIG_IMPORT by hand.
configure(subprojects.findAll { actuatorModules.contains(it.name) }) {
    tasks.named('bootRun') {
        environment 'SPRING_CONFIG_IMPORT', System.getenv('SPRING_CONFIG_IMPORT') ?: 'optional:configserver:http://localhost:8888'
    }
}
