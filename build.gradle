plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    // 4.3.4 is the spring-cloud-contract-verifier release confirmed (Ch.10 Task 1) to resolve
    // cleanly against this project's Spring Cloud 2025.0.3 BOM setup; the Gradle plugin ships
    // from the same release train as the verifier artifact.
    id 'org.springframework.cloud.contract' version '4.3.4' apply false
    // Brings up/tears down compose-component-test.yml around the componentTest task on
    // ftgo-order-service (Ch.10 sub-project 2) — the same plugin the book uses for its own
    // out-of-process component-test example.
    id 'com.avast.gradle.docker-compose' version '0.17.12' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.sanjay.ftgo'
    version = '0.0.1-SNAPSHOT'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.0"
        }
    }

    test {
        useJUnitPlatform()
    }
}

// ftgo-common is a plain library (no REST layer, no JDBC runtime of its own) — it declares
// its own minimal dependency set in its own build.gradle instead of inheriting the runnable
// services' web/mysql/test stack, so its classpath isn't bloated with dependencies it never uses.
// The gateway modules are WebFlux-based and need reactive starters, not servlet web/JPA.
def reactiveModules = ['ftgo-common', 'ftgo-gateway-common', 'ftgo-mobile-gateway', 'ftgo-public-gateway', 'ftgo-end-to-end-test']

configure(subprojects.findAll { !reactiveModules.contains(it.name) }) {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        runtimeOnly    'com.mysql:mysql-connector-j'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly    'com.h2database:h2'
    }
}
