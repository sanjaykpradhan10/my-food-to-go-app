kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ftgo
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://kind-registry:5000"]
nodes:
  - role: control-plane
    # ingress-nginx's kind provider manifest node-selects on this label
    # (deploy/static/provider/kind/deploy.yaml); without it the controller
    # pod stays Pending forever with "didn't match Pod's node affinity".
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18000
        protocol: TCP
