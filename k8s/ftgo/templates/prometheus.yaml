apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: {{ .Values.global.namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      enableServiceLinks: false
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheusImage }}
          ports: [{containerPort: 9090}]
          resources:
            requests: {memory: "256Mi", cpu: "50m"}
            limits: {memory: "512Mi"}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
          readinessProbe: {httpGet: {path: /-/ready, port: 9090}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: 9090}, initialDelaySeconds: 20, periodSeconds: 15}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: {{ .Values.global.namespace }}}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
