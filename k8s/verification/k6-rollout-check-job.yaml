apiVersion: batch/v1
kind: Job
metadata:
  name: k6-rollout-check
  namespace: ftgo
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.55.0
          args: ["run", "/scripts/rollout-check.js"]
          env:
            - name: K6_DURATION
              value: "90s"
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-rollout-check-script
