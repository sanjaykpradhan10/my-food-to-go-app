// Root build.gradle imports spring-cloud-dependencies 2024.0.0 for all subprojects (added during
// Task 2), but that release isn't compatible with the Spring Boot version pinned at the root
// (3.5.16) — CompatibilityNotMetException at startup. Override with 2025.0.3 here (matches the
// Boot 3.5.x line); a module-level dependencyManagement import takes precedence over the root's.
dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.3'
    }
}

dependencies {
    implementation project(':ftgo-gateway-common')
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
