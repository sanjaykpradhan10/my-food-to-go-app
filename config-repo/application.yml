spring:
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks

gateway:
  jwt:
    jwk-set-uri: http://localhost:9000/oauth2/jwks

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # env added for the e2e suite's live-refresh scenario: it verifies
        # config-server -> /actuator/refresh -> @RefreshScope actually took effect by reading the
        # resolved outbox.poll-fixed-delay-ms straight out of order-service's Environment via
        # GET /actuator/env/{key}, instead of inferring it from wall-clock timing.
        include: health, prometheus, refresh, env
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

sentry:
  environment: local
  # traces-sample-rate left unset (defaults to 0): this sub-project only needs error capture,
  # not Sentry's separate performance-tracing feature, which would duplicate what Tempo already
  # does via micrometer-tracing-bridge-otel.
  # sentry.dsn is deliberately NOT set here: it comes from the SENTRY_DSN environment variable
  # injected per-container (sourced from Task 1's provisioned DSN), matching how
  # SPRING_KAFKA_BOOTSTRAP_SERVERS and other environment-specific values are handled as compose
  # env vars rather than config-repo values.
  send-default-pii: false
