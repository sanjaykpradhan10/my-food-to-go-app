apply plugin: 'java-library'

// Root build.gradle imports spring-cloud-dependencies 2024.0.0 for all subprojects (added during
// Task 2), but that release isn't compatible with the Spring Boot version pinned at the root
// (3.5.16) — CompatibilityNotMetException at startup. Override with 2025.0.3 here (matches the
// Boot 3.5.x line and ftgo-mobile-gateway/ftgo-public-gateway's own overrides) so this library's
// own compile/test classpath resolves spring-cloud-starter-gateway to the same version its
// consumers run at, instead of silently falling back to the stale root BOM.
dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.3'
    }
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-webflux'
    api 'org.springframework.cloud:spring-cloud-starter-gateway'
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}
